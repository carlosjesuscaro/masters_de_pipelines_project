services:
  spark-master:
    # THE DEFINITIVE FIX: Pin the image to an explicit version
    image: bitnami/spark:3.5.0
    container_name: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
    networks:
      - spark_network

  spark-worker:
    # THE DEFINITIVE FIX: Pin the image to the same explicit version
    image: bitnami/spark:3.5.0
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    networks:
      - spark_network

  jupyter:
    # This service is correct and does not need changes
    build:
      context: .
      dockerfile: jupyter.Dockerfile
    container_name: jupyter-notebook
    ports:
      - "8888:8888"
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - GRANT_SUDO=yes
    volumes:
      - .:/home/jovyan/work
    networks:
      - spark_network
    depends_on:
      - spark-master

networks:
  spark_network:
    driver: bridge